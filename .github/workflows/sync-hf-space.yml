name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "requirements.txt"
      - "deploy/huggingface-space/**"
      - ".github/workflows/sync-hf-space.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-hf-space
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_OIDC_RESOURCE: spaces/miquelt-9/accents-cat-api
      SPACE_ID: miquelt-9/accents-cat-api
      MODEL_ID: miquelt-9/cv26-hubert-svm-calibrated
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub CLI
        run: python -m pip install --upgrade 'huggingface_hub>=1.19.0'

      - name: Authenticate with Hugging Face Trusted Publisher
        run: |
          token="$(hf auth token)"
          echo "::add-mask::$token"
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Prepare synchronized Space files
        run: |
          model_revision="$(python - <<'PY'
          import os
          from huggingface_hub import HfApi

          model_id = os.environ["MODEL_ID"]
          revision = HfApi().model_info(model_id).sha
          print(revision)
          PY
          )"
          echo "MODEL_REVISION=$model_revision" >> "$GITHUB_ENV"

          stage="$RUNNER_TEMP/accents-cat-space"
          mkdir -p "$stage/backend"
          cp -R backend/. "$stage/backend/"
          cp deploy/huggingface-space/app.py "$stage/app.py"
          cp deploy/huggingface-space/README.md "$stage/README.md"
          cp deploy/huggingface-space/packages.txt "$stage/packages.txt"
          cp requirements.txt "$stage/requirements.txt"
          printf '%s\n' "$model_revision" > "$stage/model-revision.txt"
          echo "SPACE_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Check whether the Space files changed
        id: changes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          remote = Path(os.environ["RUNNER_TEMP"]) / "accents-cat-space-current"
          snapshot_download(
              repo_id=os.environ["SPACE_ID"],
              repo_type="space",
              local_dir=remote,
              allow_patterns=[
                  "backend/**",
                  "app.py",
                  "README.md",
                  "packages.txt",
                  "requirements.txt",
                  "model-revision.txt",
              ],
          )

          stage = Path(os.environ["SPACE_STAGE"])
          staged_files = sorted(path.relative_to(stage) for path in stage.rglob("*") if path.is_file())
          changed = any(
              not (remote / relative).is_file()
              or (stage / relative).read_bytes() != (remote / relative).read_bytes()
              for relative in staged_files
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print("Space deployment files differ." if changed else "Space deployment files are already current.")
          PY

      - name: Upload backend and pinned model revision
        if: steps.changes.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import os
          import re
          from huggingface_hub import HfApi

          commit = HfApi().upload_folder(
              repo_id=os.environ["SPACE_ID"],
              repo_type="space",
              folder_path=os.environ["SPACE_STAGE"],
              commit_message=f"Sync backend from GitHub {os.environ['GITHUB_SHA']}",
              create_pr=True,
          )
          pr_url = commit.pr_url
          if not pr_url:
              raise RuntimeError(f"Hugging Face did not return a pull request URL: {commit}")
          match = re.search(r"/(?:pull|discussions)/(\d+)(?:$|[/?#])", pr_url)
          if not match:
              match = re.search(r"refs/pr/(\d+)", pr_url)
          if not match:
              raise RuntimeError(f"Could not determine Hugging Face pull request number from {pr_url}")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"HF_PR_NUMBER={match.group(1)}\n")
          print(f"Created Hugging Face Space pull request: {pr_url}")
          PY

      - name: Merge Hugging Face Space pull request
        if: steps.changes.outputs.changed == 'true'
        run: hf discussions merge "$SPACE_ID" "$HF_PR_NUMBER" --type space --yes

      - name: Wait for Space restart
        if: steps.changes.outputs.changed == 'true'
        run: hf spaces wait "$SPACE_ID" --timeout 30m

      - name: Check Space readiness
        run: |
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /tmp/space-ready.json --write-out '%{http_code}' https://miquelt-9-accents-cat-api.hf.space/ready || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/space-ready.json
              exit 0
            fi
            echo "Space readiness returned HTTP ${status}; retry ${attempt}/60"
            sleep 10
          done
          cat /tmp/space-ready.json || true
          exit 1

      - name: Smoke test one synthetic audio upload
        run: |
          python - <<'PY'
          import math
          import struct
          import wave

          path = "/tmp/space-smoke-test.wav"
          with wave.open(path, "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(16000)
              samples = (
                  struct.pack("<h", int(5000 * math.sin(2 * math.pi * 220 * i / 16000)))
                  for i in range(64000)
              )
              wav.writeframes(b"".join(samples))
          PY
          curl --fail --show-error --silent --max-time 180 \
            -F 'audio=@/tmp/space-smoke-test.wav;type=audio/wav' \
            https://miquelt-9-accents-cat-api.hf.space/analyze
          rm -f /tmp/space-smoke-test.wav
